[package]
name = "hjkl-app"
description = "Host-agnostic application layer for the hjkl editor. Used by apps/hjkl (TUI)."
keywords = ["editor", "tui"]
categories = ["text-editors"]
version.workspace = true
edition = "2024"
license = "MIT"
repository = "https://github.com/kryptic-sh/hjkl"
authors = ["mxaddict <mxaddict@kryptic.sh>"]
rust-version = "1.95"
homepage = "https://hjkl.kryptic.sh"
readme = "README.md"

[dependencies]
crossbeam-channel = "0.5"
ec4rs = "1"
git2 = { version = "0.21", default-features = false }
hjkl-anvil.workspace = true
hjkl-buffer.workspace = true
hjkl-config.workspace = true
hjkl-engine.workspace = true
hjkl-fs.workspace = true
hjkl-keymap.workspace = true
hjkl-lsp.workspace = true
hjkl-picker.workspace = true
hjkl-vim.workspace = true
libc = "0.2"
# default-features = false drops postcard's `heapless-cas` default, which
# pulls heapless 0.7 -> atomic-polyfill (RUSTSEC-2023-0089, unmaintained with
# no safe upgrade). Nothing here uses postcard's heapless types; `use-std`
# already enables `alloc`, which is what the session codec needs.
postcard = { version = "1", default-features = false, features = ["use-std"] }
similar = "3"
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }
tempfile = "3"

[[bench]]
name = "swap"
harness = false

[lints]
workspace = true
