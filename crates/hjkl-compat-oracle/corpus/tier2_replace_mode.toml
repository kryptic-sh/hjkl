# Tier 2 — `R` replace (overtype) mode.
#
# Live nvim compare.

# `RXYZ<Esc>` overtypes the first three characters.
[[cases]]
name = "replace_overtype"
initial_buffer = "abcdef\n"
initial_cursor = [0, 0]
keys = "RXYZ<Esc>"
expected_buffer = "XYZdef\n"
expected_mode = "normal"

# `R` exactly at the line length replaces every char.
[[cases]]
name = "replace_whole_line"
initial_buffer = "abc\n"
initial_cursor = [0, 0]
keys = "RXYZ<Esc>"
expected_buffer = "XYZ\n"
expected_mode = "normal"

# `R` past the end of the line extends it (overtype then append).
[[cases]]
name = "replace_past_eol_extends"
initial_buffer = "ab\n"
initial_cursor = [0, 0]
keys = "RXYZ<Esc>"
expected_buffer = "XYZ\n"
expected_mode = "normal"

# `R` mid-line then `.` repeats the replacement.
[[cases]]
name = "replace_dot_repeat"
initial_buffer = "abcdef\n"
initial_cursor = [0, 0]
keys = "RXY<Esc>l."
expected_buffer = "XYXYef\n"
expected_mode = "normal"

# `<BS>` in Replace mode restores the overwritten characters rather than
# deleting them (`:h Replace-mode`).
[[cases]]
name = "replace_backspace_restores_overtyped"
initial_buffer = "hello\n"
initial_cursor = [0, 0]
keys = "RXY<BS><BS><Esc>"
expected_buffer = "hello\n"
expected_mode = "normal"

# Backspacing past the point where Replace mode was entered just moves the
# cursor left — no further restoration, no deletion, no crossing into text
# from before the session (the first 3 <BS> restore X/Y/Z on top of "llo";
# the 4th and beyond just walk the cursor left over already-restored /
# never-touched columns).
[[cases]]
name = "replace_backspace_past_entry_point"
initial_buffer = "hello\n"
initial_cursor = [0, 2]
keys = "RXYZ<BS><BS><BS><BS><Esc>"
expected_buffer = "hello\n"
expected_mode = "normal"

# Backspacing over characters typed PAST the original end-of-line (a pure
# append, nothing to restore) deletes them instead, shrinking the line back.
[[cases]]
name = "replace_backspace_deletes_past_eol_append"
initial_buffer = "ab\n"
initial_cursor = [0, 0]
keys = "RXYZ<BS><BS><BS><BS><Esc>"
expected_buffer = "ab\n"
expected_mode = "normal"

# Dot-repeat of an `R` session still repeats only the text that survived a
# mid-session backspace (Y got backspaced away, so `.` only re-overtypes
# "X").
[[cases]]
name = "replace_dot_repeat_after_backspace"
initial_buffer = "abcdef\n"
initial_cursor = [0, 0]
keys = "RXY<BS><Esc>l."
expected_buffer = "XXcdef\n"
expected_mode = "normal"

[[cases]]
name = "replace_with_enter_splits_the_line"
initial_buffer = "abcd"
initial_cursor = [0, 1]
keys = "r<CR>"
expected_buffer = "a\ncd"
expected_cursor = [1, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "count_replace_with_enter_is_one_line_break"
initial_buffer = "abcd"
initial_cursor = [0, 1]
keys = "2r<CR>"
expected_buffer = "a\nd"
expected_cursor = [1, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "count_replace_with_enter_past_line_end_fails"
initial_buffer = "abcd"
initial_cursor = [0, 1]
keys = "5r<CR>"
expected_buffer = "abcd"
expected_cursor = [0, 1]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "replace_with_enter_keeps_blanks_without_autoindent"
initial_buffer = "ab  cd"
initial_cursor = [0, 1]
keys = "r<CR>"
expected_buffer = "a\n  cd"
expected_cursor = [1, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "replace_with_enter_repeats_with_dot"
initial_buffer = "abcd"
initial_cursor = [0, 1]
keys = "r<CR>."
expected_buffer = "a\n\nd"
expected_cursor = [2, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "replace_with_enter_undoes_in_one_step"
initial_buffer = "abcd"
initial_cursor = [0, 1]
keys = "r<CR>u"
expected_buffer = "abcd"
expected_cursor = [0, 1]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "count_replace_sets_curswant_for_j"
initial_buffer = "abcd\nabcdef"
initial_cursor = [0, 0]
keys = "3rxj"
expected_buffer = "xxxd\nabcdef"
expected_cursor = [1, 2]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false
