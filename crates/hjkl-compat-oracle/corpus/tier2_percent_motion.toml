# Tier 2 — `[count]%` go-to-percentage motion (distinct from bare `%` match).
#
# vim: `N%` jumps to the line at N percent of the file:
#   line = (N * line_count + 99) / 100, cursor on first non-blank.
# Pure motion (buffer unchanged); cursor is compared against live nvim.

# `50%` of a 10-line file → line 5 (row 4).
[[cases]]
name = "percent_50_of_10"
initial_buffer = "l1\nl2\nl3\nl4\nl5\nl6\nl7\nl8\nl9\nl10\n"
initial_cursor = [0, 0]
keys = "50%"
expected_buffer = "l1\nl2\nl3\nl4\nl5\nl6\nl7\nl8\nl9\nl10\n"
expected_mode = "normal"

# `100%` → last line.
[[cases]]
name = "percent_100_last_line"
initial_buffer = "l1\nl2\nl3\nl4\nl5\nl6\nl7\nl8\nl9\nl10\n"
initial_cursor = [0, 0]
keys = "100%"
expected_buffer = "l1\nl2\nl3\nl4\nl5\nl6\nl7\nl8\nl9\nl10\n"
expected_mode = "normal"

# `10%` → line 1 (row 0).
[[cases]]
name = "percent_10_first_line"
initial_buffer = "l1\nl2\nl3\nl4\nl5\nl6\nl7\nl8\nl9\nl10\n"
initial_cursor = [5, 0]
keys = "10%"
expected_buffer = "l1\nl2\nl3\nl4\nl5\nl6\nl7\nl8\nl9\nl10\n"
expected_mode = "normal"

[[cases]]
name = "percent_no_match_deletes_the_cursor_char"
initial_buffer = "abc"
initial_cursor = [0, 1]
keys = "d%"
expected_buffer = "ac"
expected_cursor = [0, 1]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "percent_no_match_change"
initial_buffer = "abc"
initial_cursor = [0, 1]
keys = "c%Z<Esc>"
expected_buffer = "aZc"
expected_cursor = [0, 1]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "percent_no_match_past_an_unmatched_bracket"
initial_buffer = "a(b"
initial_cursor = [0, 0]
keys = "d%"
expected_buffer = "(b"
expected_cursor = [0, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "percent_no_match_on_an_empty_line_is_a_noop"
initial_buffer = ""
initial_cursor = [0, 0]
keys = "d%"
expected_buffer = ""
expected_cursor = [0, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "percent_no_match_outdents_the_line"
initial_buffer = "  'xy'  _id.A-B  'self.x'"
initial_cursor = [0, 21]
keys = "<%"
expected_buffer = "'xy'  _id.A-B  'self.x'"
expected_cursor = [0, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "d_percent_across_lines_stays_charwise"
initial_buffer = "(ab\ncd)\nef"
initial_cursor = [0, 0]
keys = "d%"
expected_buffer = "\nef"
expected_cursor = [0, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "d_percent_from_indent_stays_charwise"
initial_buffer = "  (ab\ncd)\nef"
initial_cursor = [0, 2]
keys = "d%"
expected_buffer = "  \nef"
expected_cursor = [0, 1]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false
