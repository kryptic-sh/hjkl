# Cases here are confirmed hjkl engine divergences from neovim semantics.
# Each is tracked under issue #24 (engine vim-compat divergences) — see that
# issue for status. The oracle runs these in cron CI to surface progress
# (which still pass / which begin to pass) but failures here do NOT fail CI.
#
# `expected_buffer` / `expected_cursor` hold NEOVIM's behaviour. The oracle
# reports each case as still-diverging until hjkl matches, at which point it
# should be promoted back to its tier corpus.
#
# The substitute ex-command cases that formerly lived here have graduated to
# corpus/nvim_api_tier.toml — they pass via `hjkl --nvim-api` and are now
# asserted by the `nvim_api_tier_passes` test.
#
# All 5 cases that were parked here (mark_dot_jump_to_last_edit,
# register_blackhole_d, gi_resume_last_insert, count_100G_clamps_to_last_line,
# visual_block_jl_c_change_block) were fixed in hjkl-engine 0.5.8 and
# re-promoted to their tier-2 corpus files (kryptic-sh/hjkl#83).

# ─── di{ inner-block linewise-promotion quirks — FIXED ───────────────────────
# Both former divergences (whitespace-only inner = no-op; brace-line trailing
# content collapses to bare braces) now match nvim via the operator
# exclusive-motion adjustment in `apply_op_with_text_object`. Promoted to
# corpus/tier2_block_textobj.toml (di/ci/da/ca across {}/()/[] + visual vi{).
#
# ─── reverse Visual-block `as` from a sentence start ─────────────────────────
# With the head above the anchor and the cursor on the first char of a
# sentence, nvim 0.12.6 lands `as` on the previous sentence's first char, the
# same cell `is` lands on; hjkl lands one column left, on the space before it.
# `reverse_visual_block_sentence_landing` (hjkl-vim `text_object.rs`). See
# docs/backlog.md §1.5b.
[[cases]]
name = "blockwise_as_anchor_below_via_H_keeps_block_mode"
initial_buffer = "aaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\n"
initial_cursor = [25, 6]
keys = "<C-v>Has"
expected_buffer = "aaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\n"
expected_cursor = [3, 5]
expected_mode = "visual_block"
shiftwidth = 4
expandtab = true

[[cases]]
name = "blockwise_as_anchor_below_from_sentence_start"
initial_buffer = "aaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\n"
initial_cursor = [4, 0]
keys = "<C-v>kas"
expected_buffer = "aaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\naaa. bbb.\n"
expected_cursor = [2, 5]
expected_mode = "visual_block"
