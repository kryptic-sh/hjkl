# Tier 2 — operator + motion/text-object indent: `>{motion}` / `<{motion}`.
#
# Only `>>`/`<<` (line doubles) and visual indent were covered before; the
# operator-pending forms `>j`, `>ip`, `>G`, `<ip`, `>i{` were not.
#
# shiftwidth=4 + expandtab so output is deterministic spaces; live nvim compare.

# `>j` indents the current + next line.
[[cases]]
name = "indent_op_down"
initial_buffer = "a\nb\nc\n"
initial_cursor = [0, 0]
keys = ">j"
shiftwidth = 4
expandtab = true
expected_buffer = "    a\n    b\nc\n"
expected_mode = "normal"

# `>ip` indents the whole paragraph.
[[cases]]
name = "indent_op_inner_paragraph"
initial_buffer = "a\nb\n\nc\n"
initial_cursor = [0, 0]
keys = ">ip"
shiftwidth = 4
expandtab = true
expected_buffer = "    a\n    b\n\nc\n"
expected_mode = "normal"

# `>G` indents from the cursor to the end of the buffer.
[[cases]]
name = "indent_op_to_eof"
initial_buffer = "a\nb\nc\n"
initial_cursor = [0, 0]
keys = ">G"
shiftwidth = 4
expandtab = true
expected_buffer = "    a\n    b\n    c\n"
expected_mode = "normal"

# `<ip` unindents the paragraph.
[[cases]]
name = "outdent_op_inner_paragraph"
initial_buffer = "    a\n    b\n\nc\n"
initial_cursor = [0, 0]
keys = "<ip"
shiftwidth = 4
expandtab = true
expected_buffer = "a\nb\n\nc\n"
expected_mode = "normal"

# `>i{` indents the lines inside a brace block.
[[cases]]
name = "indent_op_inner_brace"
initial_buffer = "{\na\nb\n}\n"
initial_cursor = [1, 0]
keys = ">i{"
shiftwidth = 4
expandtab = true
expected_buffer = "{\n    a\n    b\n}\n"
expected_mode = "normal"

# `>j` followed by `.` repeats the indent at the new cursor.
[[cases]]
name = "indent_op_dot_repeat"
initial_buffer = "a\nb\nc\nd\n"
initial_cursor = [0, 0]
keys = ">j."
shiftwidth = 4
expandtab = true
expected_buffer = "        a\n        b\nc\nd\n"
expected_mode = "normal"

# ── `<BS>` in the indent ─────────────────────────────────────────────────────
#
# With whitespace before the cursor, `<BS>` deletes back to the previous stop
# (hjkl's `softtabstop`; nvim's `smarttab` uses `shiftwidth` in the indent,
# 4 in both here), counting a tab by its width.

[[cases]]
name = "backspace_in_indent_goes_to_the_previous_stop"
initial_buffer = "  q r"
initial_cursor = [0, 2]
keys = "I<BS>x<Esc>"
expected_buffer = "xq r"
expected_cursor = [0, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "backspace_in_indent_from_past_a_stop"
initial_buffer = "      q"
initial_cursor = [0, 0]
keys = "I<BS>x<Esc>"
expected_buffer = "    xq"
expected_cursor = [0, 4]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "backspace_over_a_tab_and_spaces"
initial_buffer = "  \tq"
initial_cursor = [0, 0]
keys = "I<BS>x<Esc>"
expected_buffer = "xq"
expected_cursor = [0, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "backspace_twice_in_a_deep_indent"
initial_buffer = "        q"
initial_cursor = [0, 0]
keys = "I<BS><BS>x<Esc>"
expected_buffer = "xq"
expected_cursor = [0, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

