# Motion coverage audit (#254) — motions that exist in the engine but lacked
# dedicated oracle cases. Validated against neovim. Oracle host is 80x24 and
# wraps by character like nvim, so on short lines `gj`/`gk` behave like `j`/`k`
# and `gm` clamps to the line end on lines shorter than half the screen width.

# ─── g_ : last non-blank of line ─────────────────────────────────────────────
[[cases]]
name = "g_underscore_last_non_blank"
initial_buffer = "hello   \nworld\n"
keys = "g_"
expected_buffer = "hello   \nworld\n"
expected_cursor = [0, 4]

[[cases]]
name = "g_underscore_skips_trailing_ws"
initial_buffer = "  hi  \n"
keys = "g_"
expected_buffer = "  hi  \n"
expected_cursor = [0, 3]

# ─── gj / gk : display-line down/up (== j/k with no wrap) ─────────────────────
[[cases]]
name = "gj_down_no_wrap"
initial_buffer = "aaa\nbbb\nccc\n"
keys = "lgj"
expected_buffer = "aaa\nbbb\nccc\n"
expected_cursor = [1, 1]

[[cases]]
name = "gk_up_no_wrap"
initial_buffer = "aaa\nbbb\nccc\n"
keys = "Ggk"
expected_buffer = "aaa\nbbb\nccc\n"
expected_cursor = [1, 0]

# ─── gM (char-middle, floor(chars/2)) and gm (screen-middle, width/2) ────────
# The oracle host is 80 cols (DefaultHost viewport), matching nvim's default, so
# gm = min(80/2, last_col): clamps to EOL on short lines, lands at col 40 on
# lines longer than half the screen.
[[cases]]
name = "gM_char_middle"
initial_buffer = "hello\n"
keys = "gM"
expected_buffer = "hello\n"
expected_cursor = [0, 2]

[[cases]]
name = "gm_screen_middle_clamps_short"
initial_buffer = "hello\n"
keys = "gm"
expected_buffer = "hello\n"
expected_cursor = [0, 4]

[[cases]]
name = "gm_screen_middle_long_line"
initial_buffer = "abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyz\n"
keys = "gm"
expected_buffer = "abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyz\n"
expected_cursor = [0, 40]

# ─── | : go to column (1-indexed), count-driven ──────────────────────────────
[[cases]]
name = "bar_goto_column_3"
initial_buffer = "hello world\n"
keys = "3|"
expected_buffer = "hello world\n"
expected_cursor = [0, 2]

[[cases]]
name = "bar_goto_column_1_default"
initial_buffer = "hello\n"
keys = "$|"
expected_buffer = "hello\n"
expected_cursor = [0, 0]

# ─── section motions ]] [[ ][ [] (lines starting with { or } in column 0) ─────
[[cases]]
name = "section_forward_brace"
initial_buffer = "a\n{\nb\n}\nc\n{\nd\n}\n"
keys = "]]"
expected_buffer = "a\n{\nb\n}\nc\n{\nd\n}\n"
expected_cursor = [1, 0]

[[cases]]
name = "section_end_forward_brace"
initial_buffer = "a\n{\nb\n}\nc\n{\nd\n}\n"
keys = "]["
expected_buffer = "a\n{\nb\n}\nc\n{\nd\n}\n"
expected_cursor = [3, 0]

[[cases]]
name = "section_backward_brace"
initial_buffer = "a\n{\nb\n}\nc\n{\nd\n}\n"
keys = "G[["
expected_buffer = "a\n{\nb\n}\nc\n{\nd\n}\n"
expected_cursor = [5, 0]

[[cases]]
name = "section_end_backward_brace"
initial_buffer = "a\n{\nb\n}\nc\n{\nd\n}\n"
keys = "G[]"
expected_buffer = "a\n{\nb\n}\nc\n{\nd\n}\n"
expected_cursor = [3, 0]

# ─── counts on the new wrapping motions span rows ────────────────────────────
[[cases]]
name = "count_space_wraps_rows"
initial_buffer = "ab\ncd\n"
keys = "3 "
expected_buffer = "ab\ncd\n"
expected_cursor = [1, 1]

[[cases]]
name = "count_backspace_wraps_rows"
initial_buffer = "ab\ncd\n"
keys = "G$3<BS>"
expected_buffer = "ab\ncd\n"
expected_cursor = [0, 0]

# ── Counted `$` fails on the last line, clamps everywhere else ─────────────
#
# vim's `nv_dollar` runs `cursor_down(count - 1)` before moving to the line
# end and aborts the whole command when that fails — which it does only when
# the cursor is already on the last line. An overshooting count still
# succeeds, clamped. hjkl's counted `$` always clamped, so `2C` / `2D` on a
# one-line buffer emptied the line where vim does nothing.

[[cases]]
name = "count_dollar_fails_on_the_last_line"
initial_buffer = "self.x\n"
initial_cursor = [0, 1]
keys = "2$"
expected_buffer = "self.x\n"
expected_cursor = [0, 1]
expected_mode = "normal"

[[cases]]
name = "count_change_to_eol_fails_on_the_last_line"
initial_buffer = "self.x\n"
initial_cursor = [0, 1]
keys = "2C"
expected_buffer = "self.x\n"
expected_cursor = [0, 1]
expected_mode = "normal"

[[cases]]
name = "count_delete_to_eol_fails_on_the_last_line"
initial_buffer = "self.x\n"
initial_cursor = [0, 1]
keys = "2D"
expected_buffer = "self.x\n"
expected_cursor = [0, 1]
expected_mode = "normal"

# Same rule one row up in a three-row buffer: `2D` on the last row is a
# no-op, while `2D` from the row above joins two rows.
[[cases]]
name = "count_delete_to_eol_fails_on_the_last_row_of_three"
initial_buffer = "aa\nbb\ncc\n"
initial_cursor = [2, 1]
keys = "2D"
expected_buffer = "aa\nbb\ncc\n"
expected_cursor = [2, 1]
expected_mode = "normal"

# An overshooting count is NOT a failure — it clamps to the last row.
[[cases]]
name = "count_dollar_overshooting_clamps_to_the_last_row"
initial_buffer = "aa\nbb\ncc\n"
initial_cursor = [0, 1]
keys = "5$"
expected_buffer = "aa\nbb\ncc\n"
expected_cursor = [2, 1]
expected_mode = "normal"

[[cases]]
name = "count_change_to_eol_overshooting_clamps_to_the_last_row"
initial_buffer = "aa\nbb\ncc\n"
initial_cursor = [0, 1]
keys = "5C"
expected_buffer = "a\n"
expected_cursor = [0, 1]
expected_mode = "insert"

# ─── e / E / ge / gE : word-end line-break wrapping ──────────────────────────
# `e` and `E` map to vim's `end_word`, not `fwd_word`. The virtual NUL cell
# past a line's last char reads as whitespace, so a same-class run always ends
# at end-of-line: `e` from mid-word stops on the current word's last char even
# when that is the line's last char, while `e` from the end of a word crosses
# the break to the next word's end. `empty = false` means `e` skips empty
# lines (unlike `w`). `ge`/`gE` walk backward and stop on an empty line.
# All expected_cursor values below come from live nvim runs (dfcase).

[[cases]]
name = "e_crosses_line_ending_to_next_word_end"
initial_buffer = "foo bar\nbaz qux\n"
initial_cursor = [0, 6]
keys = "e"
expected_buffer = "foo bar\nbaz qux\n"
expected_cursor = [1, 2]

[[cases]]
name = "e_from_mid_word_stops_at_line_end"
initial_buffer = "foo bar\nbaz\n"
initial_cursor = [0, 4]
keys = "e"
expected_buffer = "foo bar\nbaz\n"
expected_cursor = [0, 6]

[[cases]]
name = "e_crosses_line_ending_after_trailing_spaces"
initial_buffer = "foo   \nbar\n"
initial_cursor = [0, 2]
keys = "e"
expected_buffer = "foo   \nbar\n"
expected_cursor = [1, 2]

[[cases]]
name = "e_crosses_empty_lines_to_next_word_end"
initial_buffer = "foo\n\nbar\n"
initial_cursor = [0, 2]
keys = "e"
expected_buffer = "foo\n\nbar\n"
expected_cursor = [2, 2]

[[cases]]
name = "E_from_mid_word_stops_at_line_end"
initial_buffer = "foo bar\nbaz\n"
initial_cursor = [0, 4]
keys = "E"
expected_buffer = "foo bar\nbaz\n"
expected_cursor = [0, 6]

[[cases]]
name = "count_2e_crosses_line_ending"
initial_buffer = "foo bar baz\nqux\n"
initial_cursor = [0, 0]
keys = "2e"
expected_buffer = "foo bar baz\nqux\n"
expected_cursor = [0, 6]

[[cases]]
name = "count_3e_crosses_line_ending"
initial_buffer = "foo bar baz\nqux quux\n"
initial_cursor = [0, 0]
keys = "3e"
expected_buffer = "foo bar baz\nqux quux\n"
expected_cursor = [0, 10]

[[cases]]
name = "repeated_e_does_not_fold_lines_together"
initial_buffer = "foo bar baz\nqux quux\n"
initial_cursor = [0, 1]
keys = "eeee"
expected_buffer = "foo bar baz\nqux quux\n"
expected_cursor = [1, 2]

[[cases]]
name = "ge_crosses_line_ending_to_prev_word_end"
initial_buffer = "foo bar\nbaz qux\n"
initial_cursor = [1, 6]
keys = "ge"
expected_buffer = "foo bar\nbaz qux\n"
expected_cursor = [1, 2]

[[cases]]
name = "gE_crosses_line_ending_to_prev_word_end"
initial_buffer = "foo bar\nbaz qux\n"
initial_cursor = [1, 6]
keys = "gE"
expected_buffer = "foo bar\nbaz qux\n"
expected_cursor = [1, 2]

[[cases]]
name = "e_at_eof_newline_terminated_stays"
initial_buffer = "foo\n"
initial_cursor = [0, 2]
keys = "e"
expected_buffer = "foo\n"
expected_cursor = [0, 2]

[[cases]]
name = "e_at_eof_not_newline_terminated_stays"
initial_buffer = "foo"
initial_cursor = [0, 2]
keys = "e"
expected_buffer = "foo"
expected_cursor = [0, 2]

[[cases]]
name = "e_to_trailing_empty_line_lands_on_it"
initial_buffer = "foo\n\n"
initial_cursor = [0, 2]
keys = "e"
expected_buffer = "foo\n\n"
expected_cursor = [1, 0]

[[cases]]
name = "e_from_space_before_word_lands_on_its_end"
initial_buffer = "foo  bar\nbaz\n"
initial_cursor = [0, 3]
keys = "e"
expected_buffer = "foo  bar\nbaz\n"
expected_cursor = [0, 7]

# ── First non-blank on an all-blank line ─────────────────────────────────────
#
# vim's `beginline(BL_WHITE | BL_FIX)`: with no non-blank on the line, the
# cursor lands on its last char, never on column 0. `I` is the one user
# without `BL_FIX`, so it inserts after the whitespace.

[[cases]]
name = "first_non_blank_on_an_all_blank_line_is_its_last_char"
initial_buffer = "abc\n    \nxyz\n"
initial_cursor = [0, 1]
keys = "j^"
expected_buffer = "abc\n    \nxyz\n"
expected_cursor = [1, 3]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "first_non_blank_line_motion_on_an_all_blank_line"
initial_buffer = "abc\n    \nxyz\n"
initial_cursor = [0, 1]
keys = "<CR>"
expected_buffer = "abc\n    \nxyz\n"
expected_cursor = [1, 3]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "dd_onto_an_all_blank_line_lands_on_its_last_char"
initial_buffer = "abc\n    \nxyz\n"
initial_cursor = [0, 1]
keys = "dd"
expected_buffer = "    \nxyz\n"
expected_cursor = [0, 3]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "insert_I_on_an_all_blank_line_goes_after_the_whitespace"
initial_buffer = "abc\n    \nxyz\n"
initial_cursor = [0, 1]
keys = "jIx<Esc>"
expected_buffer = "abc\n    x\nxyz\n"
expected_cursor = [1, 4]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false


