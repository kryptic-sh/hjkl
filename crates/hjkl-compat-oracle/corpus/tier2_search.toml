# Tier 2 search + extended find corpus — ~8 cases covering `/` / `?` /
# `n` / `N` / `*` / `#` (search) plus find-backward variants beyond tier1's
# `f` / `t`.
#
# All buffers are ASCII-only.

# `/foo<CR>` lands on first match.
[[cases]]
name = "search_slash_forward_first_match"
initial_buffer = "alpha foo bar\nfoo baz\n"
initial_cursor = [0, 0]
keys = "/foo<CR>"
expected_buffer = "alpha foo bar\nfoo baz\n"
expected_cursor = [0, 6]

# `/foo<CR>n` lands on second match.
[[cases]]
name = "search_n_repeats_forward"
initial_buffer = "alpha foo bar\nfoo baz\n"
initial_cursor = [0, 0]
keys = "/foo<CR>n"
expected_buffer = "alpha foo bar\nfoo baz\n"
expected_cursor = [1, 0]

# `/foo<CR>nN` returns to first match.
[[cases]]
name = "search_capital_n_reverses"
initial_buffer = "alpha foo bar\nfoo baz\n"
initial_cursor = [0, 0]
keys = "/foo<CR>nN"
expected_buffer = "alpha foo bar\nfoo baz\n"
expected_cursor = [0, 6]

# `?foo<CR>` searches backward.
[[cases]]
name = "search_question_backward"
initial_buffer = "alpha foo bar\nfoo baz\n"
initial_cursor = [1, 6]
keys = "?foo<CR>"
expected_buffer = "alpha foo bar\nfoo baz\n"
expected_cursor = [1, 0]

# `*` jumps to next occurrence of word at cursor.
[[cases]]
name = "search_star_word_forward"
initial_buffer = "foo bar foo baz\n"
initial_cursor = [0, 0]
keys = "*"
expected_buffer = "foo bar foo baz\n"
expected_cursor = [0, 8]

# `#` jumps to previous occurrence of word at cursor.
[[cases]]
name = "search_hash_word_backward"
initial_buffer = "foo bar foo baz\n"
initial_cursor = [0, 8]
keys = "#"
expected_buffer = "foo bar foo baz\n"
expected_cursor = [0, 0]

# `F` finds char backward on line.
[[cases]]
name = "find_F_backward"
initial_buffer = "hello world\n"
initial_cursor = [0, 6]
keys = "Fo"
expected_buffer = "hello world\n"
expected_cursor = [0, 4]

# `T` lands just-after char backward on line.
[[cases]]
name = "find_T_till_backward"
initial_buffer = "hello world\n"
initial_cursor = [0, 6]
keys = "To"
expected_buffer = "hello world\n"
expected_cursor = [0, 5]

# `/\<bar\><CR>` — vim word-boundary search; cursor lands on standalone `bar`,
# not on the `bar` embedded in `foobar`. Exercises the `\<`/`\>` → `\b`
# pre-processor (closes #33).
[[cases]]
name = "search_vim_word_boundary"
initial_buffer = "foobar bar baz\n"
initial_cursor = [0, 0]
# The literal `<` of the `\<` word-boundary atom must be encoded as `<lt>` so
# the macro decoder doesn't treat `<bar\>` as a key-notation token. `>` is not
# special, so `\>` stays literal.
keys = "/\\<lt>bar\\><CR>"
expected_buffer = "foobar bar baz\n"
expected_cursor = [0, 7]

# Note: smartcase / \c / \C cases live in nvim_api_tier.toml because they
# exercise hjkl-only default settings (ignorecase=true, smartcase=true) that
# differ from nvim's out-of-the-box defaults and therefore cannot be compared
# against nvim with --clean. The nvim_api_tier.toml driver runs hjkl alone.

# ─── search updates the sticky column (curswant) ────────────────────────────
# A search hit is an explicit jump: vim resets `curswant` to the column the
# cursor actually landed on, so the NEXT `j`/`k` aims at the match's column,
# not at wherever the cursor was before the search. Expectations below were
# taken from headless nvim, not predicted.

# `/` then `j`: the vertical motion must aim at the match column (10), not at
# the column the preceding `j` established (0).
[[cases]]
name = "search_slash_sets_sticky_col_for_next_j"
initial_buffer = "ab\n0123456789target0123\nzzzzzzzzzzzzzzzzzzzzzz\n"
initial_cursor = [0, 0]
keys = "j/target<CR>j"
expected_buffer = "ab\n0123456789target0123\nzzzzzzzzzzzzzzzzzzzzzz\n"
expected_cursor = [2, 10]

# `?` then `j` onto a SHORT row: the landing column proves which sticky value
# is live — clamped from 10 gives col 1, a stale sticky of 0 gives col 0.
[[cases]]
name = "search_question_sets_sticky_col_for_next_j"
initial_buffer = "0123456789target0123\nab\nzzzzzzzzzzzzzzzzzzzzzz\n"
initial_cursor = [0, 0]
keys = "j?target<CR>j"
expected_buffer = "0123456789target0123\nab\nzzzzzzzzzzzzzzzzzzzzzz\n"
expected_cursor = [1, 1]

# Same for `k` back onto a short row.
[[cases]]
name = "search_sets_sticky_col_for_next_k"
initial_buffer = "qqqqqqqqqqqqqqqqqqqq\nab\n0123456789target\n"
initial_cursor = [0, 0]
keys = "j/target<CR>k"
expected_buffer = "qqqqqqqqqqqqqqqqqqqq\nab\n0123456789target\n"
expected_cursor = [1, 1]

# `n` then `j` — `n` already went through the motion path, so this guards the
# repeat direction rather than the commit path.
[[cases]]
name = "search_n_then_j_uses_match_col"
initial_buffer = "ab\n01234target\nzzzzzzzzzzzz\n0123456789target\nqqqqqqqqqqqqqqqq\n"
initial_cursor = [0, 0]
keys = "j/target<CR>nj"
expected_buffer = "ab\n01234target\nzzzzzzzzzzzz\n0123456789target\nqqqqqqqqqqqqqqqq\n"
expected_cursor = [4, 10]

# A search with no preceding vertical motion must also set the column, not
# leave it unset — the first `j` after it aims at the match column.
[[cases]]
name = "search_sets_sticky_col_without_prior_motion"
initial_buffer = "ab\n0123456789target0123\nzzzzzzzzzzzzzzzzzzzzzz\n"
initial_cursor = [0, 0]
keys = "/target<CR>j"
expected_buffer = "ab\n0123456789target0123\nzzzzzzzzzzzzzzzzzzzzzz\n"
expected_cursor = [2, 10]
