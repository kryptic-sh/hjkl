# Tier 2 — visual-mode `J` / `gJ` (join the selected lines).
#
# Live nvim compare.

# `VjJ` joins the two selected lines with a single space.
[[cases]]
name = "visual_J_join_two"
initial_buffer = "a\nb\nc\n"
initial_cursor = [0, 0]
keys = "VjJ"
expected_buffer = "a b\nc\n"
expected_mode = "normal"

# `VGJ` joins the whole buffer into one line.
[[cases]]
name = "visual_J_join_all"
initial_buffer = "a\nb\nc\n"
initial_cursor = [0, 0]
keys = "VGJ"
expected_buffer = "a b c\n"
expected_mode = "normal"

# `VjgJ` joins without inserting a space.
[[cases]]
name = "visual_gJ_join_no_space"
initial_buffer = "a\nb\nc\n"
initial_cursor = [0, 0]
keys = "VjgJ"
expected_buffer = "ab\nc\n"
expected_mode = "normal"

# Charwise visual `J` also joins the spanned lines.
[[cases]]
name = "visual_char_J"
initial_buffer = "foo\nbar\nbaz\n"
initial_cursor = [0, 0]
keys = "vjJ"
expected_buffer = "foo bar\nbaz\n"
expected_mode = "normal"

[[cases]]
name = "visual_join_with_nothing_to_join_keeps_the_start"
initial_buffer = "  baz  xy"
initial_cursor = [0, 3]
keys = "vlJ"
expected_buffer = "  baz  xy"
expected_cursor = [0, 3]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "visual_join_backward_with_nothing_to_join"
initial_buffer = "  baz  xy"
initial_cursor = [0, 5]
keys = "vhhJ"
expected_buffer = "  baz  xy"
expected_cursor = [0, 3]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "visual_block_join_with_nothing_to_join"
initial_buffer = "  baz  xy"
initial_cursor = [0, 3]
keys = "<C-v>a{J"
expected_buffer = "  baz  xy"
expected_cursor = [0, 3]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "visual_raw_join_with_nothing_to_join"
initial_buffer = "ab"
initial_cursor = [0, 1]
keys = "vgJ"
expected_buffer = "ab"
expected_cursor = [0, 1]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "visual_join_still_joins_the_next_line"
initial_buffer = "ab\ncd\nef"
initial_cursor = [0, 1]
keys = "vJ"
expected_buffer = "ab cd\nef"
expected_cursor = [0, 2]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false
