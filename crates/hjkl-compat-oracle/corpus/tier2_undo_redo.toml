initial_buffer = "aa bb\n  cc dd\nee ff\ngg hh\n"
initial_cursor = [0, 3]
keys = "jjdju<C-r>"
expected_buffer = "aa bb\n  cc dd\n"
expected_cursor = [1, 2]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

