# Tier 2 case + join corpus — `gu` / `gU` / `g~` operators on text objects,
# `J` / `gJ` line joins.
#
# Indent operators (`>>` / `<<` / `>iB`) are excluded — they depend on
# shiftwidth / expandtab settings that diverge between hjkl defaults and
# nvim defaults; engine unit tests cover those.
#
# All buffers are ASCII-only.

# `guiw` lowercases word.
[[cases]]
name = "case_gu_iw_lowercases_word"
initial_buffer = "FOO bar\n"
initial_cursor = [0, 0]
keys = "guiw"
expected_buffer = "foo bar\n"
expected_cursor = [0, 0]

# `gUiw` uppercases word.
[[cases]]
name = "case_gU_iw_uppercases_word"
initial_buffer = "foo bar\n"
initial_cursor = [0, 0]
keys = "gUiw"
expected_buffer = "FOO bar\n"
expected_cursor = [0, 0]

# `g~iw` toggles case of word.
[[cases]]
name = "case_g_tilde_iw_toggles_word"
initial_buffer = "Foo bar\n"
initial_cursor = [0, 0]
keys = "g~iw"
expected_buffer = "fOO bar\n"
expected_cursor = [0, 0]

# `J` joins next line with space separator.
[[cases]]
name = "join_J_with_space"
initial_buffer = "foo\nbar\n"
initial_cursor = [0, 0]
keys = "J"
expected_buffer = "foo bar\n"
expected_cursor = [0, 3]

# `gJ` joins next line without space.
[[cases]]
name = "join_gJ_no_space"
initial_buffer = "foo\nbar\n"
initial_cursor = [0, 0]
keys = "gJ"
expected_buffer = "foobar\n"
expected_cursor = [0, 3]

# ── Joining an empty line ────────────────────────────────────────────────────
#
# Nothing is appended, so the join point is past the end of the line; vim
# clamps the cursor onto the last character.

[[cases]]
name = "join_with_an_empty_line_keeps_the_cursor_on_the_line"
initial_buffer = "abc\n\nx"
initial_cursor = [0, 0]
keys = "J"
expected_buffer = "abc\nx"
expected_cursor = [0, 2]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "raw_join_with_an_empty_line_keeps_the_cursor_on_the_line"
initial_buffer = "abc\n\nx"
initial_cursor = [0, 0]
keys = "gJ"
expected_buffer = "abc\nx"
expected_cursor = [0, 2]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "join_with_a_blank_line"
initial_buffer = "abc\n  \nx"
initial_cursor = [0, 0]
keys = "J"
expected_buffer = "abc\nx"
expected_cursor = [0, 2]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "counted_raw_join_over_empty_lines"
initial_buffer = "abc\n\n\nx"
initial_cursor = [0, 0]
keys = "3gJ"
expected_buffer = "abc\nx"
expected_cursor = [0, 2]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "x_after_joining_an_empty_line"
initial_buffer = "abc\n\nx"
initial_cursor = [0, 0]
keys = "gJx"
expected_buffer = "ab\nx"
expected_cursor = [0, 1]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false


# ── A counted join on the last line ──────────────────────────────────────────
#
# Nothing is left to join. With a count of 3 or more vim still moves the cursor
# to column 0 (not the first non-blank); a bare or `2` count keeps the column.

[[cases]]
name = "counted_join_on_the_last_line_moves_to_column_zero"
initial_buffer = "hello, baz"
initial_cursor = [0, 3]
keys = "3J"
expected_buffer = "hello, baz"
expected_cursor = [0, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "counted_join_on_an_indented_last_line_moves_to_column_zero"
initial_buffer = "  abc"
initial_cursor = [0, 3]
keys = "3J"
expected_buffer = "  abc"
expected_cursor = [0, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "counted_raw_join_on_the_last_line_moves_to_column_zero"
initial_buffer = "ab\ncd"
initial_cursor = [1, 1]
keys = "9gJ"
expected_buffer = "ab\ncd"
expected_cursor = [1, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

[[cases]]
name = "join_with_a_count_of_two_on_the_last_line_keeps_the_column"
initial_buffer = "hello, baz"
initial_cursor = [0, 3]
keys = "2J"
expected_buffer = "hello, baz"
expected_cursor = [0, 3]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false

