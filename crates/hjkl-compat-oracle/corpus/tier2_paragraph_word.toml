# Tier 2 paragraph + word motion corpus — `{` / `}` / `(` / `)` plus
# `W` / `B` / `E` / `ge` / `gE`. The `W`/`B`/`E` big-word forms are already
# in tier1; this file focuses on `ge`/`gE` end-back variants and
# paragraph/sentence boundaries.
#
# All buffers are ASCII-only.

# `}` jumps to next blank line (paragraph end).
[[cases]]
name = "paragraph_close_brace_forward"
initial_buffer = "alpha\nbeta\n\ngamma\n"
initial_cursor = [0, 0]
keys = "}"
expected_buffer = "alpha\nbeta\n\ngamma\n"
expected_cursor = [2, 0]

# `{` jumps back to prev blank line (paragraph start).
[[cases]]
name = "paragraph_open_brace_back"
initial_buffer = "alpha\n\nbeta\ngamma\n"
initial_cursor = [3, 0]
keys = "{"
expected_buffer = "alpha\n\nbeta\ngamma\n"
expected_cursor = [1, 0]

# `}` in the LAST paragraph lands on the last character of the last line, not
# column 0 (vim's `findpar` tail). Single-line buffer: `}` from column 0 walks
# to the end of the buffer.
[[cases]]
name = "paragraph_close_brace_reaches_last_char_single_line"
initial_buffer = "    it's.{foo}.A-B.{A-B}"
initial_cursor = [0, 0]
keys = "}"
expected_buffer = "    it's.{foo}.A-B.{A-B}"
expected_cursor = [0, 23]

# Same rule with two lines and no blank between them: `}` lands on the last
# char of line 2, not on its column 0.
[[cases]]
name = "paragraph_close_brace_reaches_last_char_multiline"
initial_buffer = "alpha\nbeta\n"
initial_cursor = [0, 0]
keys = "}"
expected_buffer = "alpha\nbeta\n"
expected_cursor = [1, 3]

# `}` stops at the FIRST blank line below the cursor. The blank run is only
# stepped over when the cursor already sits inside it (see
# `paragraph_motions_walk_blank_lines`), never when the cursor is on text.
[[cases]]
name = "paragraph_close_brace_stops_at_adjacent_blank"
initial_buffer = "alpha\n\nbeta\n"
initial_cursor = [0, 0]
keys = "}"
expected_buffer = "alpha\n\nbeta\n"
expected_cursor = [1, 0]

# Mirror for `{`: it stops at the blank line directly above, not at row 0.
[[cases]]
name = "paragraph_open_brace_stops_at_adjacent_blank"
initial_buffer = "alpha\n\nbeta\n"
initial_cursor = [2, 0]
keys = "{"
expected_buffer = "alpha\n\nbeta\n"
expected_cursor = [1, 0]

# A counted `}` that runs out of paragraphs FAILS — vim leaves the cursor
# exactly where it was rather than clamping to the last row.
[[cases]]
name = "paragraph_close_brace_counted_overshoot_fails"
initial_buffer = "alpha\n\n\nbeta\n\ngamma\n"
initial_cursor = [0, 0]
keys = "9}"
expected_buffer = "alpha\n\n\nbeta\n\ngamma\n"
expected_cursor = [0, 0]

# `d}` over the final paragraph: the motion is inclusive at end-of-buffer and
# the delete promotes to linewise (vim's "strange Vi behaviour"), so the whole
# buffer goes and the register holds linewise text.
[[cases]]
name = "operator_d_close_brace_to_end_of_buffer"
initial_buffer = "alpha\nbeta\n"
initial_cursor = [0, 0]
keys = "d}"
expected_buffer = ""
expected_cursor = [0, 0]
expected_register = ['"', "alpha\nbeta\n"]

# `d}` starting past the first non-blank stays charwise and stops at the end of
# the line above the blank — it does not eat the line break.
[[cases]]
name = "operator_d_close_brace_midline_stops_at_eol"
initial_buffer = "alpha\n\nbeta\n"
initial_cursor = [0, 1]
keys = "d}"
expected_buffer = "a\n\nbeta\n"
expected_cursor = [0, 0]
expected_register = ['"', "lpha"]

# `y}` from column 0 yanks the paragraph LINEWISE (vim's exclusive-motion
# adjustment), so `P` puts it back as a whole line above.
[[cases]]
name = "operator_y_close_brace_paragraph_is_linewise"
initial_buffer = "alpha\n\nbeta\n"
initial_cursor = [0, 0]
keys = "y}P"
expected_buffer = "alpha\nalpha\n\nbeta\n"
expected_cursor = [0, 0]
expected_register = ['"', "alpha\n"]

# `B` from column 0 with an empty line above lands ON that empty line — vim
# counts an empty line as a WORD for the backward motions.
[[cases]]
name = "word_B_from_col0_stops_on_empty_line"
initial_buffer = "alpha\n\nbeta\n"
initial_cursor = [2, 0]
keys = "B"
expected_buffer = "alpha\n\nbeta\n"
expected_cursor = [1, 0]

# Same for `b`.
[[cases]]
name = "word_b_from_col0_stops_on_empty_line"
initial_buffer = "alpha\n\nbeta\n"
initial_cursor = [2, 0]
keys = "b"
expected_buffer = "alpha\n\nbeta\n"
expected_cursor = [1, 0]

# `B` from column 0 of row 1 when row 0 is empty: the motion succeeds and lands
# at the start of the buffer (it must not fail and leave the cursor on row 1).
[[cases]]
name = "word_B_from_col0_first_line_empty"
initial_buffer = "\nalpha\n"
initial_cursor = [1, 0]
keys = "B"
expected_buffer = "\nalpha\n"
expected_cursor = [0, 0]

# Row 0 whitespace-only (NOT a paragraph boundary and not a WORD): the backward
# skip runs out of buffer and vim still succeeds at (0, 0).
[[cases]]
name = "word_B_from_col0_first_line_blank"
initial_buffer = "  \nalpha\n"
initial_cursor = [1, 0]
keys = "B"
expected_buffer = "  \nalpha\n"
expected_cursor = [0, 0]

# Operator form of the same landing: `dB` deletes the blank first line and the
# line break, joining onto row 1.
[[cases]]
name = "operator_dB_from_col0_first_line_blank"
initial_buffer = "  \nalpha\n"
initial_cursor = [1, 0]
keys = "dB"
expected_buffer = "alpha\n"
expected_cursor = [0, 0]
expected_register = ['"', "  \n"]

# `ge` jumps to end of previous word.
[[cases]]
name = "word_ge_end_back"
initial_buffer = "foo bar baz\n"
initial_cursor = [0, 8]
keys = "ge"
expected_buffer = "foo bar baz\n"
expected_cursor = [0, 6]

# `gE` jumps to end of previous WORD.
[[cases]]
name = "word_gE_big_end_back"
initial_buffer = "foo-bar baz\n"
initial_cursor = [0, 8]
keys = "gE"
expected_buffer = "foo-bar baz\n"
expected_cursor = [0, 6]

# `w` on an empty line: vim counts the empty line as a word, so `w` steps off
# it to the first word of the next non-empty line.
[[cases]]
name = "word_w_from_empty_line"
initial_buffer = "foo\n\nbar\n"
initial_cursor = [1, 0]
keys = "w"
expected_buffer = "foo\n\nbar\n"
expected_cursor = [2, 0]

# `w` on an empty line with another empty line following stops on that next
# empty line (each empty line is its own word).
[[cases]]
name = "word_w_from_empty_line_to_empty_line"
initial_buffer = "foo\n\n\nbar\n"
initial_cursor = [1, 0]
keys = "w"
expected_buffer = "foo\n\n\nbar\n"
expected_cursor = [2, 0]

# `dw` on the LAST word of a line stops at end-of-line — it does NOT eat the
# newline and join the next line (vim `:h word` special case).
[[cases]]
name = "operator_dw_last_word_keeps_newline"
initial_buffer = "foo bar\nbaz\n"
initial_cursor = [0, 4]
keys = "dw"
expected_buffer = "foo \nbaz\n"
expected_cursor = [0, 3]

# Same special case with leading indent on the next line: `dw` still stops at
# end of the current line rather than deleting into "  baz".
[[cases]]
name = "operator_dw_last_word_next_line_indented"
initial_buffer = "foo bar\n  baz\n"
initial_cursor = [0, 4]
keys = "dw"
expected_buffer = "foo \n  baz\n"
expected_cursor = [0, 3]

# `d2w` whose LAST word is mid-line on a later row is NOT clamped — the
# special case only applies when the last word ends its line. Here it deletes
# "foo\nbar " up to "baz".
[[cases]]
name = "operator_d2w_into_midline_word_not_clamped"
initial_buffer = "foo\nbar baz\n"
initial_cursor = [0, 0]
keys = "d2w"
expected_buffer = "baz\n"
expected_cursor = [0, 0]

# `yw` on the last word of a line yanks just the word (no trailing newline);
# pasting it back reproduces the word inline.
[[cases]]
name = "operator_yw_last_word_no_newline"
initial_buffer = "foo bar\nbaz\n"
initial_cursor = [0, 4]
keys = "ywP"
expected_buffer = "foo barbar\nbaz\n"
expected_cursor = [0, 6]

# ── `}` sets `*pincl` even when it does not move ───────────────────────────
#
# With the cursor already on the last character of the last line, `}` is a
# zero-distance motion — but vim still marks it inclusive, so `d}` deletes
# that one character. hjkl treated every zero-width charwise range as a
# failed motion and did nothing.

[[cases]]
name = "operator_d_paragraph_zero_distance_deletes_last_char"
initial_buffer = "abc\n"
initial_cursor = [0, 2]
keys = "d}"
expected_buffer = "ab\n"
expected_cursor = [0, 1]
expected_mode = "normal"
expected_register = ['"', "c"]

[[cases]]
name = "operator_y_paragraph_zero_distance_yanks_last_char"
initial_buffer = "abc\n"
initial_cursor = [0, 2]
keys = "y}"
expected_buffer = "abc\n"
expected_cursor = [0, 2]
expected_mode = "normal"
expected_register = ['"', "c"]

[[cases]]
name = "operator_c_paragraph_zero_distance_changes_last_char"
initial_buffer = "abc\n"
initial_cursor = [0, 2]
keys = "c}X"
expected_buffer = "abX\n"
expected_cursor = [0, 3]
expected_mode = "insert"

# The same landing in a later paragraph, so the rule is not special to a
# one-paragraph buffer.
[[cases]]
name = "operator_d_paragraph_zero_distance_in_last_paragraph"
initial_buffer = "abc\n\ndef\n"
initial_cursor = [2, 2]
keys = "d}"
expected_buffer = "abc\n\nde\n"
expected_cursor = [2, 1]
expected_mode = "normal"
expected_register = ['"', "f"]

# The guard that had to survive the fix: `d$` on an empty line is still a
# no-op. It is the other zero-width inclusive range, and relaxing the guard
# for `RangeKind::Inclusive` in general would have made it eat the line
# break.
[[cases]]
name = "operator_d_line_end_on_empty_line_is_a_noop"
initial_buffer = "abc\n\n"
initial_cursor = [1, 0]
keys = "d$"
expected_buffer = "abc\n\n"
expected_cursor = [1, 0]
expected_mode = "normal"

# ── Backward word motions stop at a line boundary ──────────────────────────
#
# vim's `dec()` steps from column 0 of a row onto the PREVIOUS row's virtual
# end-of-line cell — one past its last character — whose `cls()` is
# whitespace. That cell is what ends a same-class run at the boundary. hjkl's
# step-back went straight to the last character instead, a real char of the
# same class, so `b` / `B` / `ge` / `gE` walked through the line break and
# kept consuming the row above.

[[cases]]
name = "motion_b_stops_at_the_word_start_on_its_own_row"
initial_buffer = "abc def\nghi jkl\n"
initial_cursor = [1, 1]
keys = "b"
expected_buffer = "abc def\nghi jkl\n"
expected_cursor = [1, 0]
expected_mode = "normal"

[[cases]]
name = "motion_B_stops_at_the_WORD_start_on_its_own_row"
initial_buffer = "'self.x'\n(foo) a, {xy}  \n"
initial_cursor = [1, 1]
keys = "B"
expected_buffer = "'self.x'\n(foo) a, {xy}  \n"
expected_cursor = [1, 0]
expected_mode = "normal"

# From column 0 there is no word start left on the row, so the motion does
# cross — onto the last word of the row above, not into the middle of it.
[[cases]]
name = "motion_b_from_column_zero_crosses_to_the_previous_word"
initial_buffer = "abc def\nghi jkl\n"
initial_cursor = [1, 0]
keys = "b"
expected_buffer = "abc def\nghi jkl\n"
expected_cursor = [0, 4]
expected_mode = "normal"

[[cases]]
name = "motion_3B_walks_whole_WORDs_across_the_break"
initial_buffer = "\"self.x\" a, (bar).'hello'\na.\"n1\"  'a' _id\n"
initial_cursor = [1, 1]
keys = "3B"
expected_buffer = "\"self.x\" a, (bar).'hello'\na.\"n1\"  'a' _id\n"
expected_cursor = [0, 9]
expected_mode = "normal"

# `ge` / `gE` ride the same step-back, and land on the END of the previous
# word — the virtual EOL cell is skipped as whitespace rather than becoming
# the landing site.
[[cases]]
name = "motion_ge_lands_on_the_previous_word_end_across_the_break"
initial_buffer = "abc def\nghi jkl\n"
initial_cursor = [1, 0]
keys = "ge"
expected_buffer = "abc def\nghi jkl\n"
expected_cursor = [0, 6]
expected_mode = "normal"

[[cases]]
name = "motion_gE_lands_on_the_previous_WORD_end_across_the_break"
initial_buffer = "a.b c\nd e.f\n"
initial_cursor = [1, 0]
keys = "gE"
expected_buffer = "a.b c\nd e.f\n"
expected_cursor = [0, 4]
expected_mode = "normal"

# An empty line is a word for the backward motions: `b` stops ON it rather
# than skipping through to the paragraph above.
[[cases]]
name = "motion_b_stops_on_an_empty_line"
initial_buffer = "abc\n\ndef\n"
initial_cursor = [2, 1]
keys = "b"
expected_buffer = "abc\n\ndef\n"
expected_cursor = [2, 0]
expected_mode = "normal"

[[cases]]
name = "motion_2b_stops_on_an_empty_line"
initial_buffer = "abc\n\ndef\n"
initial_cursor = [2, 1]
keys = "2b"
expected_buffer = "abc\n\ndef\n"
expected_cursor = [1, 0]
expected_mode = "normal"

# `ge` inside the FIRST word of the buffer has no previous word end to find.
# vim walks off the front and succeeds at (0, 0); hjkl's old walk returned
# without moving at all.
[[cases]]
name = "motion_ge_inside_the_first_word_lands_at_the_buffer_start"
initial_buffer = "abc def\nghi jkl\n"
initial_cursor = [0, 2]
keys = "ge"
expected_buffer = "abc def\nghi jkl\n"
expected_cursor = [0, 0]
expected_mode = "normal"

[[cases]]
name = "motion_gE_inside_the_first_WORD_lands_at_the_buffer_start"
initial_buffer = "'self.x'\n(foo) a, {xy}  \n"
initial_cursor = [0, 4]
keys = "gE"
expected_buffer = "'self.x'\n(foo) a, {xy}  \n"
expected_cursor = [0, 0]
expected_mode = "normal"

# ── Counted `ip` / `ap` over-run → no-op (not best-effort whole-buffer) ──────
#
# When the count exceeds the number of paragraph units available, vim FAILS the
# text object (a no-op) rather than extending to the whole buffer. hjkl used to
# clamp the range to EOF. Pinned from nvim 0.12.5; every expectation here is the
# nvim-measured outcome.

# `d2ip` on a single paragraph: only one `ip` unit exists, so the object fails
# and the buffer / cursor / default register are all unchanged.
[[cases]]
name = "textobj_d2ip_single_paragraph_over_run_noop"
initial_buffer = "aaa.\nbbb.\nccc.\n"
initial_cursor = [0, 0]
keys = "d2ip"
expected_buffer = "aaa.\nbbb.\nccc.\n"
expected_cursor = [0, 0]
expected_mode = "normal"
expected_register = ['"', ""]

# `y2ip` over-run: the default register stays empty (nothing yanked).
[[cases]]
name = "textobj_y2ip_single_paragraph_over_run_noop"
initial_buffer = "aaa.\nbbb.\nccc.\n"
initial_cursor = [0, 0]
keys = "y2ip"
expected_buffer = "aaa.\nbbb.\nccc.\n"
expected_cursor = [0, 0]
expected_mode = "normal"
expected_register = ['"', ""]

# `d3ip` over-run on the same buffer.
[[cases]]
name = "textobj_d3ip_single_paragraph_over_run_noop"
initial_buffer = "aaa.\nbbb.\nccc.\n"
initial_cursor = [0, 0]
keys = "d3ip"
expected_buffer = "aaa.\nbbb.\nccc.\n"
expected_cursor = [0, 0]
expected_mode = "normal"
expected_register = ['"', ""]

# `d2ap` over-run: a single paragraph with no trailing blank line has no second
# `ap` unit, so the object fails.
[[cases]]
name = "textobj_d2ap_single_paragraph_over_run_noop"
initial_buffer = "aaa.\nbbb.\nccc.\n"
initial_cursor = [0, 0]
keys = "d2ap"
expected_buffer = "aaa.\nbbb.\nccc.\n"
expected_cursor = [0, 0]
expected_mode = "normal"
expected_register = ['"', ""]

# `v2ip` over-run: visual mode stays active with the cursor unmoved and no
# selection (the object failed), rather than collapsing to a linewise selection.
[[cases]]
name = "textobj_v2ip_single_paragraph_over_run_noop"
initial_buffer = "aaa.\nbbb.\nccc.\n"
initial_cursor = [0, 0]
keys = "v2ip"
expected_buffer = "aaa.\nbbb.\nccc.\n"
expected_cursor = [0, 0]
expected_mode = "visual"

# `v2ipy` over-run: the failed selection yanks the single character under the
# cursor ("a") into the default register, then returns to normal mode — not the
# whole buffer.
[[cases]]
name = "textobj_v2ipy_single_paragraph_over_run_noop"
initial_buffer = "aaa.\nbbb.\nccc.\n"
initial_cursor = [0, 0]
keys = "v2ipy"
expected_buffer = "aaa.\nbbb.\nccc.\n"
expected_cursor = [0, 0]
expected_mode = "normal"
expected_register = ['"', "a"]

# `d6ip` over-run with three paragraphs present: five `ip` units exist
# (para, blank, para, blank, para), so a count of 6 fails rather than clamping.
[[cases]]
name = "textobj_d6ip_three_paragraph_over_run_noop"
initial_buffer = "aaa.\n\nbbb.\n\nccc.\n"
initial_cursor = [0, 0]
keys = "d6ip"
expected_buffer = "aaa.\n\nbbb.\n\nccc.\n"
expected_cursor = [0, 0]
expected_mode = "normal"
expected_register = ['"', ""]

# `d4ap` over-run with three paragraphs: three `ap` units exist (the last
# paragraph has no trailing blank), so a count of 4 fails.
[[cases]]
name = "textobj_d4ap_three_paragraph_over_run_noop"
initial_buffer = "aaa.\n\nbbb.\n\nccc.\n"
initial_cursor = [0, 0]
keys = "d4ap"
expected_buffer = "aaa.\n\nbbb.\n\nccc.\n"
expected_cursor = [0, 0]
expected_mode = "normal"
expected_register = ['"', ""]

# ── `ap` blank-line cursor + trailing-blank-run-at-EOF semantics ─────────────
#
# `ap` is nvim's `current_par(include=true)`: the count drives a UNIFORM loop of
# whole paragraph units (no separate "first unit"), and a unit with nowhere to
# start FAILs (a no-op). Two gaps vs hjkl were pinned here:
#   * a blank-line cursor's `Nap` walks blank-run + paragraph units; the LAST
#     unit stops at the paragraph (does not take the following blank run), and
#     running out of units is a no-op, not a whole-buffer clamp;
#   * a paragraph whose trailing blank run reaches EOF takes the WHOLE blank run
#     (then `Nap` over-runs), not a single trailing blank line.
# Pinned from nvim 0.12.5; every expectation is the nvim-measured outcome.

# `d2ap` from the blank line between two paragraphs: blank + bbb, then blank +
# ccc — everything after "aaa." goes, the default register holds it linewise.
[[cases]]
name = "textobj_d2ap_blank_line_between_paragraphs"
initial_buffer = "aaa.\n\nbbb.\n\nccc.\n"
initial_cursor = [1, 0]
keys = "d2ap"
expected_buffer = "aaa.\n"
expected_cursor = [0, 0]
expected_mode = "normal"
expected_register = ['"', "\nbbb.\n\nccc.\n"]

# `d3ap` from the same blank line: only two `ap` units exist, so the object
# over-runs and fails (buffer, cursor, register all unchanged).
[[cases]]
name = "textobj_d3ap_blank_line_between_paragraphs_over_run_noop"
initial_buffer = "aaa.\n\nbbb.\n\nccc.\n"
initial_cursor = [1, 0]
keys = "d3ap"
expected_buffer = "aaa.\n\nbbb.\n\nccc.\n"
expected_cursor = [1, 0]
expected_mode = "normal"
expected_register = ['"', ""]

# Single `ap` from a blank line: the blank run plus the following paragraph,
# and NOT the blank run after it.
[[cases]]
name = "textobj_dap_blank_line_before_last_paragraph"
initial_buffer = "aaa.\n\nbbb.\n\nccc.\n"
initial_cursor = [3, 0]
keys = "dap"
expected_buffer = "aaa.\n\nbbb.\n"
expected_cursor = [2, 0]
expected_mode = "normal"
expected_register = ['"', "\nccc.\n"]

# `dap` on a paragraph whose trailing blank run reaches EOF takes the WHOLE run
# (both blank lines), emptying the buffer.
[[cases]]
name = "textobj_dap_trailing_blank_run_to_eof"
initial_buffer = "a\n\n\n"
initial_cursor = [0, 0]
keys = "dap"
expected_buffer = ""
expected_cursor = [0, 0]
expected_mode = "normal"
expected_register = ['"', "a\n\n\n"]

# `d2ap` over the same: the first unit consumes everything to EOF, so the second
# unit fails and the object is a no-op.
[[cases]]
name = "textobj_d2ap_trailing_blank_run_to_eof_over_run_noop"
initial_buffer = "a\n\n\n"
initial_cursor = [0, 0]
keys = "d2ap"
expected_buffer = "a\n\n\n"
expected_cursor = [0, 0]
expected_mode = "normal"
expected_register = ['"', ""]

# `dap` on a trailing blank run with no paragraph after it is a no-op.
[[cases]]
name = "textobj_dap_blank_run_at_eof_noop"
initial_buffer = "a\n\n"
initial_cursor = [1, 0]
keys = "dap"
expected_buffer = "a\n\n"
expected_cursor = [1, 0]
expected_mode = "normal"
expected_register = ['"', ""]
