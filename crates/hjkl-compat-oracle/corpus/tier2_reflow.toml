# Tier 2 — `gq` / `gw` reflow against `textwidth`.
#
# `gq{motion}` reflows the lines to `textwidth`, leaving the cursor at the end of
# the reflowed text; `gw{motion}` does the same but restores the cursor. Expected
# buffers captured from `nvim --headless` with `set textwidth=10`.

# `gqq` reflows the current line.
[[cases]]
name = "reflow_gqq_current_line"
initial_buffer = "one two three four five\n"
initial_cursor = [0, 0]
keys = "gqq"
expected_buffer = "one two\nthree four\nfive\n"
expected_mode = "normal"
textwidth = 10

# `gqap` reflows the whole paragraph.
[[cases]]
name = "reflow_gqap_paragraph"
initial_buffer = "one two three four five six\n"
initial_cursor = [0, 0]
keys = "gqap"
expected_buffer = "one two\nthree four\nfive six\n"
expected_mode = "normal"
textwidth = 10

# `gww` reflows the current line and restores the cursor (cursor-stable form).
[[cases]]
name = "reflow_gww_current_line"
initial_buffer = "one two three four five\n"
initial_cursor = [0, 0]
keys = "gww"
expected_buffer = "one two\nthree four\nfive\n"
expected_mode = "normal"
textwidth = 10

# `gqj` reflows the current line plus the one below.
[[cases]]
name = "reflow_gqj_two_lines"
initial_buffer = "one two three\nfour five six\n"
initial_cursor = [0, 0]
keys = "gqj"
expected_buffer = "one two\nthree four\nfive six\n"
expected_mode = "normal"
textwidth = 10

# `gqq` at a wider textwidth=20 (G4) — a different wrap column than the other
# cases here, to pin the harness's per-case textwidth override itself, not
# just one specific wrap width.
[[cases]]
name = "reflow_gqq_textwidth_20"
initial_buffer = "one two three four five six seven eight\n"
initial_cursor = [0, 0]
keys = "gqq"
expected_buffer = "one two three four\nfive six seven eight\n"
expected_mode = "normal"
textwidth = 20

# Whitespace-preserving reflow: `gq` must NOT squeeze interior space runs or
# strip trailing whitespace (nvim keeps both).

# `gqq` within textwidth leaves the line byte-identical.
[[cases]]
name = "reflow_gqq_preserves_interior_runs"
initial_buffer = "aaa  bbb   ccc\n"
initial_cursor = [0, 0]
keys = "gqq"
expected_buffer = "aaa  bbb   ccc\n"
expected_mode = "normal"
textwidth = 79

# Interior runs stay on the wrapped line; only the gap immediately before a
# break is dropped.
[[cases]]
name = "reflow_gqq_interior_gap_dropped_at_break"
initial_buffer = "aaa  bbb   ccc  ddd  eee\n"
initial_cursor = [0, 0]
keys = "gqq"
expected_buffer = "aaa  bbb\nccc  ddd\neee\n"
expected_cursor = [2, 0]
expected_mode = "normal"
textwidth = 10

# `gqap` over a multi-line paragraph: the line break joins to a single space
# (previous line ends in non-whitespace), interior runs preserved.
[[cases]]
name = "reflow_gqap_multiline_whitespace"
initial_buffer = "aaa  bbb\nccc  ddd\n"
initial_cursor = [0, 0]
keys = "gqap"
expected_buffer = "aaa  bbb\nccc  ddd\n"
expected_cursor = [1, 0]
expected_mode = "normal"
textwidth = 10

# Leading whitespace on the first line is the paragraph leader, re-emitted on
# every wrapped line.
[[cases]]
name = "reflow_gqap_leading_whitespace_leader"
initial_buffer = "   aaa  bbb\nccc\n"
initial_cursor = [0, 0]
keys = "gqap"
expected_buffer = "   aaa\n   bbb ccc\n"
expected_cursor = [1, 3]
expected_mode = "normal"
textwidth = 10

# Trailing whitespace on the last line survives on the wrapped last line.
[[cases]]
name = "reflow_gqq_trailing_whitespace_preserved"
initial_buffer = "aaa  bbb  ccc   \n"
initial_cursor = [0, 0]
keys = "gqq"
expected_buffer = "aaa  bbb\nccc   \n"
expected_cursor = [1, 0]
expected_mode = "normal"
textwidth = 10

# A word longer than textwidth sits on its own line, overflowing.
[[cases]]
name = "reflow_gqq_long_word_overflows"
initial_buffer = "aaa supercalifragilistic bbb\n"
initial_cursor = [0, 0]
keys = "gqq"
expected_buffer = "aaa\nsupercalifragilistic\nbbb\n"
expected_cursor = [2, 0]
expected_mode = "normal"
textwidth = 10

# A tab in the whitespace counts as tabstop (8) for the wrap column but is
# preserved verbatim in the output.
[[cases]]
name = "reflow_gqq_tab_gap"
initial_buffer = "aaa\tbbb ccc ddd\n"
initial_cursor = [0, 0]
keys = "gqq"
expected_buffer = "aaa\nbbb ccc\nddd\n"
expected_cursor = [2, 0]
expected_mode = "normal"
textwidth = 10
tabstop = 8

# Blank lines stay paragraph separators; `gqG` reflows each paragraph in place.
[[cases]]
name = "reflow_gqG_blank_line_separator"
initial_buffer = "aaa  bbb\n\nccc  ddd\n"
initial_cursor = [0, 0]
keys = "gqG"
expected_buffer = "aaa  bbb\n\nccc  ddd\n"
expected_cursor = [2, 0]
expected_mode = "normal"
textwidth = 10

# ── Continuation indent follows 'autoindent' ──────────────────────────────────
#
# The lines `gq` / `gw` open take the paragraph's indent only under
# `'autoindent'`, as vim's auto-wrap copies the indent onto each line it opens.
# Without it they start at column 0.

[[cases]]
name = "reflow_gqq_noautoindent_continuation_starts_at_col0"
initial_buffer = "    one two three four five six\n"
initial_cursor = [0, 0]
keys = "gqq"
expected_buffer = "    one two three\nfour five six\n"
expected_mode = "normal"
textwidth = 20
autoindent = false

[[cases]]
name = "reflow_gqq_autoindent_continuation_keeps_the_indent"
initial_buffer = "    one two three four five six\n"
initial_cursor = [0, 0]
keys = "gqq"
expected_buffer = "    one two three\n    four five six\n"
expected_mode = "normal"
textwidth = 20
autoindent = true

[[cases]]
name = "reflow_gww_noautoindent_keeps_the_cursor_char"
initial_buffer = "    one two three four five six\n"
initial_cursor = [0, 18]
keys = "gww"
expected_buffer = "    one two three\nfour five six\n"
expected_cursor = [1, 0]
expected_mode = "normal"
textwidth = 20
autoindent = false

[[cases]]
name = "reflow_visual_gq_noautoindent"
initial_buffer = "    one two three four five six\nseven\n"
initial_cursor = [0, 0]
keys = "Vjgq"
expected_buffer = "    one two three\nfour five six seven\n"
expected_mode = "normal"
textwidth = 20
autoindent = false

# ── Blank lines and the cursor ────────────────────────────────────────────────
#
# A blank line ends a paragraph and is left exactly as it is, whitespace and
# all. The cursor ends on the LAST line of the range, a trailing blank line
# included; when the exclusive-motion adjustment shrank the range (`gq}`,
# `gq{`), on the line after it. On a whitespace-only line it lands on the last
# char.

[[cases]]
name = "reflow_keeps_a_whitespace_only_line"
initial_buffer = "aa bb\n  \ncc dd\n"
initial_cursor = [0, 0]
keys = "gqG"
expected_buffer = "aa bb\n  \ncc dd\n"
expected_cursor = [2, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false
textwidth = 20

[[cases]]
name = "reflow_cursor_ends_on_a_trailing_blank_line"
initial_buffer = "aa bb\n\ncc\n"
initial_cursor = [0, 0]
keys = "gqap"
expected_buffer = "aa bb\n\ncc\n"
expected_cursor = [1, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false
textwidth = 20

[[cases]]
name = "reflow_gq_brace_lands_after_the_adjusted_range"
initial_buffer = "aa bb cc dd ee ff gg hh\n\ncc\n"
initial_cursor = [0, 0]
keys = "gq}"
expected_buffer = "aa bb cc dd ee ff gg\nhh\n\ncc\n"
expected_cursor = [2, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false
textwidth = 20

[[cases]]
name = "reflow_gq_back_brace_lands_after_the_adjusted_range"
initial_buffer = "aa bb\n\ncc\n"
initial_cursor = [2, 0]
keys = "gq{"
expected_buffer = "aa bb\n\ncc\n"
expected_cursor = [2, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false
textwidth = 20

[[cases]]
name = "reflow_cursor_on_a_whitespace_only_last_line"
initial_buffer = "aa\n   \n"
initial_cursor = [0, 0]
keys = "gqj"
expected_buffer = "aa\n   \n"
expected_cursor = [1, 2]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false
textwidth = 20

[[cases]]
name = "reflow_gw_keeps_the_column_on_a_whitespace_only_line"
initial_buffer = "aa\n   \nbb\n"
initial_cursor = [1, 2]
keys = "gwj"
expected_buffer = "aa\n   \nbb\n"
expected_cursor = [1, 2]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false
textwidth = 20


# ── The indent is rebuilt ────────────────────────────────────────────────────
#
# vim formats with `set_indent`: the same width, rebuilt as spaces under
# `expandtab` and as tabs + spaces under `noexpandtab`.

[[cases]]
name = "reflow_rebuilds_a_tab_indent_as_spaces_under_expandtab"
initial_buffer = "\taa bb cc dd ee ff gg"
initial_cursor = [0, 0]
keys = "gqq"
expected_buffer = "    aa bb cc dd ee\nff gg"
expected_cursor = [1, 0]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false
textwidth = 20

[[cases]]
name = "reflow_rebuilds_a_mixed_indent"
initial_buffer = "  \taa bb"
initial_cursor = [0, 0]
keys = "gqq"
expected_buffer = "    aa bb"
expected_cursor = [0, 4]
expected_mode = "normal"
shiftwidth = 4
expandtab = true
autoindent = false
textwidth = 40


[[cases]]
name = "reflow_rebuilds_a_space_indent_as_a_tab_under_noexpandtab"
initial_buffer = "    aa bb cc dd ee ff gg"
initial_cursor = [0, 0]
keys = "gqq"
expected_buffer = "\taa bb cc dd ee\n\tff gg"
expected_mode = "normal"
shiftwidth = 4
tabstop = 4
expandtab = false
autoindent = true
textwidth = 20

