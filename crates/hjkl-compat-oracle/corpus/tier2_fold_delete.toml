# A single-line fold does not expand: `x` stays a one-char delete.
[[cases]]
name = "single_line_fold_x_stays_charwise"
initial_buffer = "abc\n"
initial_cursor = [0, 0]
keys = "zf$x"
foldmethod = "manual"
expected_buffer = "bc\n"
expected_mode = "normal"
expected_register = ['"', "a"]

# After `l`, the `x` / `dw` that follows is charwise. The reason is
# `'foldopen'`, whose default contains `hor`: the `l` that moved to column 1
# OPENED the fold as it finished, so the operator is looking at an open fold.
# Within ONE command the fold does stay closed — see `3e` below.
[[cases]]
name = "x_at_col1_on_closed_fold_stays_charwise"
initial_buffer = "abc\ndef\nghi\n"
initial_cursor = [0, 0]
keys = "zfjlx"
foldmethod = "manual"
expected_buffer = "ac\ndef\nghi\n"
expected_cursor = [0, 1]
expected_mode = "normal"
expected_register = ['"', "b"]

[[cases]]
name = "dw_at_col1_on_closed_fold_stays_charwise"
initial_buffer = "abc\ndef\nghi\n"
initial_cursor = [0, 0]
keys = "zfjldw"
foldmethod = "manual"
expected_buffer = "a\ndef\nghi\n"
expected_mode = "normal"
expected_register = ['"', "bc"]

# ── `'foldopen'` ─────────────────────────────────────────────────────────────
#
# nvim's default `'foldopen'` is `block,hor,mark,percent,quickfix,search,tag,
# undo`: once a command TYPED in Normal mode finishes, these classes open every
# fold holding the cursor row. Not under an operator, not in Visual, and not
# while `@q` replays keys. A `hor` motion has to succeed — a failed `l` opens
# nothing — except `0` / `^` / `$`, which succeed without moving. `g_`, `|`,
# `ge` and the vertical motions are in no class.

