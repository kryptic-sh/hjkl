# ── A closed fold under the operator, without `'foldopen'` ───────────────────
#
# With nothing having opened it, a fold the cursor sits in at column > 0 is
# still closed: a FORWARD charwise operator starts at its column 0 and takes it
# whole. A BACKWARD charwise one (`db`, `d0`) is left exactly as the motion
# made it — nvim widens backward ranges over folds only when they are linewise.

[[cases]]
name = "x_at_col2_of_a_closed_fold_takes_the_whole_fold"
initial_buffer = "abc def\nghi\njkl\n"
initial_cursor = [0, 2]
keys = "zfjx"
foldmethod = "manual"
shiftwidth = 4
expandtab = true
