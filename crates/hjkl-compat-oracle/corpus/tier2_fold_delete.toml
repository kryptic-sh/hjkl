# Within a SINGLE command the fold is still closed in nvim too: `'foldopen'`
# only fires once the command finishes. So the third iteration of `3e` — which
# starts from a landing inside the fold, at column 1 — still takes the fold
# jump. This is the case a plain "column 0 only" reading of the two cases
# above would get wrong.

[[cases]]
name = "counted_3e_within_one_command_still_sees_the_fold_closed"
initial_buffer = "aa\nbb cc\nDD\nee\n"
initial_cursor = [0, 0]
keys = "jzfjk3e"
foldmethod = "manual"
expected_buffer = "aa\nbb cc\nDD\nee\n"
expected_cursor = [3, 1]
expected_mode = "normal"
expected_register = ['"', ""]

[[cases]]
name = "d3e_within_one_command_still_sees_the_fold_closed"
initial_buffer = "aa\nbb cc\nDD\nee\n"
initial_cursor = [0, 0]
keys = "jzfjkd3e"
foldmethod = "manual"
expected_buffer = ""
expected_cursor = [0, 0]
expected_mode = "normal"
expected_register = ['"', "aa\nbb cc\nDD\nee\n"]


