initial_cursor = [0, 0]
keys = "zfjldd"
foldmethod = "manual"
shiftwidth = 4
expandtab = true
expected_buffer = "def\nghi\n"
expected_cursor = [0, 0]
expected_mode = "normal"
expected_register = ['"', "abc\n"]

