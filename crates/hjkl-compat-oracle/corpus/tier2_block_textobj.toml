initial_cursor = [11, 0]
keys = "<C-v>H>"
shiftwidth = 4
expandtab = true
expected_buffer = "    aaa bbb ccc\n    ddd eee fff\n    ggg hhh iii\n    jjj kkk lll\n    mmm nnn ooo\n    ppp qqq rrr\n    sss ttt uuu\n    vvv www xxx\n    yyy zzz aaa\n    bbb ccc ddd\n    eee fff ggg\n    hhh iii jjj\n"
expected_cursor = [0, 0]
expected_mode = "normal"

