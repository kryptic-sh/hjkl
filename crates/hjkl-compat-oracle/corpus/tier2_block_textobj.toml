# ── counted Visual text objects ──────────────────────────────────────────────
# Probed against neovim 0.12.4. Counts typed in Visual mode are handed through
# the pending `i` / `a` chord; reverse block sentences alternate body and
# separator landings on one row, but never expose a newline as a separator.

# Characterwise and linewise Visual selections retain the object range's
# register type when yanked.
[[cases]]
name = "counted_visual_inner_word_yank"
initial_buffer = "one two three four\n"
initial_cursor = [0, 0]
keys = "v2iwy"
expected_buffer = "one two three four\n"
expected_register = ['"', "one "]
expected_mode = "normal"

[[cases]]
name = "counted_visual_around_word_yank"
initial_buffer = "one two three four\n"
initial_cursor = [0, 0]
keys = "v3awy"
expected_buffer = "one two three four\n"
expected_register = ['"', "one two three "]
expected_mode = "normal"

[[cases]]
name = "counted_visual_inner_paragraph_yank_linewise"
initial_buffer = "one\ntwo\n\nthree\nfour\n\nfive\n"
initial_cursor = [0, 0]
keys = "v2ipy"
expected_buffer = "one\ntwo\n\nthree\nfour\n\nfive\n"
expected_register = ['"', "one\ntwo\n\n"]
expected_mode = "normal"

[[cases]]
name = "counted_visual_around_paragraph_yank_linewise"
initial_buffer = "one\ntwo\n\nthree\nfour\n\nfive\n"
initial_cursor = [0, 0]
keys = "v3apy"
expected_buffer = "one\ntwo\n\nthree\nfour\n\nfive\n"
expected_register = ['"', "one\ntwo\n\nthree\nfour\n\nfive\n"]
expected_mode = "normal"

[[cases]]
name = "counted_visual_inner_sentence_yank"
initial_buffer = "aaa. bbb. ccc. ddd.\n"
initial_cursor = [0, 0]
keys = "v2isy"
expected_buffer = "aaa. bbb. ccc. ddd.\n"
expected_register = ['"', "aaa. "]
expected_mode = "normal"

[[cases]]
name = "counted_visual_around_sentence_yank"
initial_buffer = "aaa. bbb. ccc. ddd.\n"
initial_cursor = [0, 0]
keys = "v3asy"
expected_buffer = "aaa. bbb. ccc. ddd.\n"
expected_register = ['"', "aaa. bbb. ccc. "]
expected_mode = "normal"

[[cases]]
name = "counted_visual_inner_bracket_yank"
initial_buffer = "x (one (two) three) y\n"
initial_cursor = [0, 8]
keys = "v2iby"
expected_buffer = "x (one (two) three) y\n"
expected_register = ['"', "one (two) three"]
expected_mode = "normal"

[[cases]]
name = "counted_visual_inner_bracket_overflow_yank"
initial_buffer = "x (one (two) three) y\n"
initial_cursor = [0, 8]
keys = "v3iby"
expected_buffer = "x (one (two) three) y\n"
expected_register = ['"', "t"]
expected_mode = "normal"

