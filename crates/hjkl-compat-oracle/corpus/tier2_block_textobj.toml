keys = "<C-v>jgEy"
expected_buffer = "aaa bbb ccc\nddd eee fff\nggg hhh iii\njjj kkk lll\nmmm nnn ooo\nppp qqq rrr\nsss ttt uuu\nvvv www xxx\nyyy zzz aaa\nbbb ccc ddd\neee fff ggg\nhhh iii jjj\n"
expected_register = ['"', "eee fff ggg\nhhh iii jjj"]
expected_cursor = [10, 0]
expected_mode = "normal"

