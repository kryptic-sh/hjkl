initial_cursor = [0, 3]
keys = "<C-v>jit"
expected_buffer = "<a>x\ny</a>\n"
expected_cursor = [1, 3]
expected_mode = "visual_block"

# ── blockwise visual + g-motions EXTEND the block column ──────────────────────
# neovim 0.12.4: `gE` / `ge` / `g_` / `gM` / `gm` / `g#` are horizontal
# motions in blockwise visual — the cursor lands on the target column and the
# block extends to it. hjkl used to leave `block_vcol` untouched on the
# `g`-prefixed motions (plain `E`/`e`/`_` went through the block-vcol sync,
# `apply_after_g`'s arms did not), so `<C-v>jgE~` flipped only the block's
# first column. Verified against neovim 0.12.4 via dfcase.

[[cases]]
name = "blockwise_gE_yank_extends_block"
