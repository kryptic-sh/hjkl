initial_cursor = [0, 0]
keys = "<C-v>japy"
expected_buffer = "aaa\n\nbbb\n\n"
expected_register = ['"', "a\n\nb\n"]
expected_cursor = [0, 0]
expected_mode = "normal"

[[cases]]
name = "blockwise_ap_yank_anchor_below"
