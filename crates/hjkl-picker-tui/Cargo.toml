[package]
name = "hjkl-picker-tui"
description = "Ratatui adapter for hjkl-picker — preview pane renderer + ttyr key router."
keywords = ["picker", "fuzzy", "tui", "ratatui", "terminal"]
categories = ["command-line-interface"]
version.workspace = true
edition = "2024"
license = "MIT"
repository = "https://github.com/kryptic-sh/hjkl"
homepage = "https://hjkl.kryptic.sh"
authors = ["mxaddict <mxaddict@kryptic.sh>"]
rust-version = "1.95"
readme = "README.md"

[dependencies]
hjkl-picker.workspace = true
hjkl-buffer.workspace = true
hjkl-buffer-tui.workspace = true
hjkl-engine.workspace = true
hjkl-engine-tui.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["std", "layout-cache", "underline-color"] }
ttyr = "0.2.0"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
