name: Nix

# Kept apart from ci.yml so a Nix-only failure never blocks a release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    name: nix ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Also builds packages.default: checks.<system>.hjkl is the same
      # derivation.
      - run: nix flake check -L
